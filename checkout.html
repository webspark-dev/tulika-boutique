<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="তুলিকা অর্ডার চেকআউট।"><meta property="og:title" content="চেকআউট — তুলিকা"><meta property="og:description" content="আপনার অর্ডার সম্পূর্ণ করুন।"><meta property="og:type" content="website"><title>চেকআউট — তুলিকা</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%235A1B33'/%3E%3Ctext x='50%25' y='55%25' text-anchor='middle' dominant-baseline='middle' font-size='42' fill='%23E3A02B'%3Eতু%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/store.css"><script type="module" src="assets/app.js"></script></head>
<body data-page="checkout" data-title="চেকআউট"><div id="app-header"></div><main id="main" class="wrap section"><h1 class="page-title" data-i18n="checkout">চেকআউট</h1><div id="global-error" class="notice" hidden></div><div class="cart-layout"><section class="card"><h2 class="section-title" data-i18n="checkout">চেকআউট</h2><form id="checkout-form" class="admin-form">
<label class="field"><span data-i18n="name">আপনার নাম</span><input name="name" autocomplete="name" maxlength="120" required></label>
<label class="field"><span data-i18n="phone">১০ সংখ্যার ফোন নম্বর</span><input name="phone" type="tel" inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10" autocomplete="tel-national" required></label>
<label class="field"><span data-i18n="address">সম্পূর্ণ ঠিকানা</span><textarea name="address" minlength="5" maxlength="500" autocomplete="street-address" required></textarea></label>
<label class="field"><span data-i18n="city">শহর</span><input name="city" maxlength="100" autocomplete="address-level2" required></label>
<label class="field"><span data-i18n="pin">৬ সংখ্যার PIN</span><input name="pin" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="postal-code" required></label>
<label class="field"><span data-i18n="notes">অর্ডার নোট (ঐচ্ছিক)</span><textarea name="notes" maxlength="1000"></textarea></label>
<div class="field"><span>পেমেন্ট</span><label class="check"><input type="radio" name="payment" value="cod" checked><span data-i18n="cod">ক্যাশ অন ডেলিভারি</span></label><label class="check"><input type="radio" name="payment" value="upi_manual"><span data-i18n="upi">UPI-তে পেমেন্ট — মালিক হাতে নিশ্চিত করবেন</span></label><p class="notice" data-i18n="payPlaceholder"></p></div>
<label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label><button id="place-order" class="button" type="submit" data-i18n="placeOrder">অর্ডার নিশ্চিত করুন</button></form></section>
<aside class="card summary"><h2 class="section-title" data-i18n="cart">আপনার ব্যাগ</h2><ul id="checkout-lines"></ul><p><span data-i18n="subtotal">পণ্যের মোট</span> <strong id="checkout-subtotal"></strong></p><p><span data-i18n="shipping">ডেলিভারি</span> <strong id="checkout-shipping"></strong></p><p><span data-i18n="total">সর্বমোট</span> <strong id="checkout-total"></strong></p></aside></div></main><div id="app-footer"></div><a class="floating-wa" id="floating-wa" target="_blank" rel="noopener" aria-label="WhatsApp" href="#">✆</a><div id="toast" class="toast" role="status" hidden></div></body></html>
